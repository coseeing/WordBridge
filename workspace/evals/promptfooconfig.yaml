prompts:
  - "Standard_v3"

defaultTest:
  assert:
    - type: cost
      threshold: 0.002
    - type: latency
      threshold: 10000
    - type: python
      value: file://assertions.py

derivedMetrics:
  - name: mean_case_f2
    value: "case_f2 / __count"
  - name: mean_case_ned
    value: "case_ned / __count"
  - name: overall_precision
    value: |
      function(namedScores) {
        const tp = namedScores.true_positives || 0;
        const fp = namedScores.false_positives || 0;
        return tp + fp === 0 ? 1 : tp / (tp + fp);
      }
  - name: overall_recall
    value: |
      function(namedScores) {
        const tp = namedScores.true_positives || 0;
        const fn = namedScores.false_negatives || 0;
        return tp + fn === 0 ? 1 : tp / (tp + fn);
      }
  - name: overall_f2
    value: |
      function(namedScores) {
        const tp = namedScores.true_positives || 0;
        const fp = namedScores.false_positives || 0;
        const fn = namedScores.false_negatives || 0;
        const denominator = 5 * tp + fp + 4 * fn;
        return denominator === 0 ? 1 : (5 * tp) / denominator;
      }

providers:
  - id: "python:provider.py"
    label: "WordBridge Local Smoke"
    config:
      # 成本與 latency 由 workspace/evals/provider.py 回傳
      # 本地 smoke test 先用 Ollama 驗證資料流與欄位結構
      # 若上游沒有明確 usage/cost，provider.py 會用下列費率做本地近似成本估算
      provider: "Ollama"
      local: true
      model: "qwen2"
      estimated_cost_input_per_million: 0.14
      estimated_cost_output_per_million: 0.28
      language: "zh_traditional"
      corrector_mode: "standard"

tests:
  - datasets/smoke_test.csv
